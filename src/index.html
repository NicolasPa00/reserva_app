<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>EscalApp · Reservas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Icono de marca.
       Las rutas van SIN barra inicial a propósito: se resuelven contra el <base href>,
       que el build reescribe a /admin/, /restaurante/ o /reserva/ según la app. Con
       "/images/icono.png" el navegador las pedía a la raíz del dominio, donde no están.

       Los archivos los genera "admin_app_v21/scripts/generar-iconos.mjs", que lee el logotipo
       oficial del diseñador y escribe en las TRES apps: hasta el 2026-10-28 estas dos seguían
       con el hexágono anterior al Brand Book mientras la landing ya llevaba el isotipo nuevo.
       Es el isotipo blanco sobre el fondo "#191a24" del logotipo; SIN la palabra «EscalApp»,
       que a 16 px es un borrón de tres píxeles de alto.

       Este es el icono de respaldo: en el portal público, que lo abre el CLIENTE del negocio, lo
       reemplaza el logo del inquilino vía "FaviconService"; este solo se ve cuando el negocio no
       tiene logo subido.

       El "?v=2" es lo único que obliga al navegador a volver a pedirlo. Al cambiarlo: subir a v3.
       Los PNG de 16/32 ya no se declaran: Chrome los escoge antes que el SVG, que es más nítido. -->
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="manifest" href="site.webmanifest">
  <!-- El fondo del logotipo, el mismo que el manifiesto (antes "#4338CA", el índigo anterior). -->
  <meta name="theme-color" content="#191a24">
  <!-- Nombre bajo el icono al añadir a la pantalla de inicio en iOS. -->
  <meta name="apple-mobile-web-app-title" content="EscalApp">
</head>
<body>
  <app-root></app-root>
</body>
</html>
