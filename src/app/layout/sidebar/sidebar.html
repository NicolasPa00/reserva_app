<aside class="sidebar">
  <header class="sidebar__brand">
    <lucide-icon name="calendar-clock" [size]="22" />
    <div>
      <strong>{{ auth.negocio()?.nombre || 'Reservas' }}</strong>
      <span>{{ auth.rolPrincipal() }}</span>
    </div>
  </header>

  <nav class="sidebar__nav">
    @for (it of itemsPermitidos(); track it.route) {
      <a [routerLink]="it.route"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: false }">
        <lucide-icon [name]="it.icon" [size]="18" />
        <span>{{ it.label }}</span>
      </a>
    }
  </nav>

  <footer class="sidebar__footer">
    <button type="button" class="sidebar__logout" (click)="logout()" title="Cerrar sesión">
      <lucide-icon name="log-out" [size]="18" />
      <span>Cerrar sesión</span>
    </button>
  </footer>
</aside>
